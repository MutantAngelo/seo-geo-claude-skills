name: Sync Skills

on:
  push:
    branches: [main]
    paths:
      - "research/**/SKILL.md"
      - "build/**/SKILL.md"
      - "optimize/**/SKILL.md"
      - "monitor/**/SKILL.md"
      - "cross-cutting/**/SKILL.md"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Sync skills manifest
        run: node .github/scripts/sync-skills.js

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore: sync skills manifest"
          file_pattern: "marketplace.json .claude-plugin/plugin.json"

