name: Validate Agent Skill
on:
  push:
    branches: [main]
    paths: ['**/SKILL.md', '.github/workflows/validate-skill.yml', '.github/scripts/validate-skills-safe.py']
  pull_request:
    branches: [main]
    paths: ['**/SKILL.md', '.github/workflows/validate-skill.yml', '.github/scripts/validate-skills-safe.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate skill frontmatter without shell interpolation
        run: python3 .github/scripts/validate-skills-safe.py
